name: Send OIDC Token to External Trigger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  trigger-external-system:
    runs-on: ubuntu-latest
    
    # CRITICAL: This permission block is required to generate the OIDC token
    permissions:
      id-token: write
      contents: read 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch GitHub OIDC Token
        id: get_token
        run: |
          # Request the OIDC token from GitHub's internal provider
          # The audience must match what your JFrog identity mapping expects
          OIDC_TOKEN=$(curl -sLS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jfrog" | jq -r '.value')
          
          # Mask the token so it is redacted if accidentally printed in the logs
          echo "::add-mask::$OIDC_TOKEN"
          
          # Pass the token to the next step via GitHub outputs
          echo "oidc_token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger External System
        env:
          # Store your external system's URL securely in GitHub Actions Secrets
          EXTERNAL_WEBHOOK_URL: ${{ secrets.EXTERNAL_WEBHOOK_URL }} 
        run: |
          # Send the token to your external system
          # WARNING: Ensure EXTERNAL_WEBHOOK_URL is HTTPS to prevent interception
          curl -X POST "$EXTERNAL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"subject_token\": \"${{ steps.get_token.outputs.oidc_token }}\", \"repository\": \"${{ github.repository }}\"}"
