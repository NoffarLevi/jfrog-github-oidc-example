name: jfrog-oidc-repro

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  JF_URL: https://elinaf.jfrog.io

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: jfrog/setup-jfrog-cli@v5.0.0
        id: jfrog-auth
        with:
          oidc-provider-name: ronma
          oidc-audience: jf
            
      - name: Decode JFrog token scope
        env:
          JFROG_TOKEN: ${{ steps.jfrog-auth.outputs.oidc-token }}
        run: |
          echo "${JFROG_TOKEN}" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .


      - name: Call Artifactory
        env:
          JFROG_TOKEN: ${{ steps.jfrog-auth.outputs.oidc-token }}
        run: |
          echo "Token length: ${#JFROG_TOKEN}"
          curl -sS -f -vvv -X GET "${JF_URL}/artifactory/noffarl-generic/package.json" \
            -H "Authorization: Bearer ${JFROG_TOKEN}" 
